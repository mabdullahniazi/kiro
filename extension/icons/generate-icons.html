<!DOCTYPE html>
<!-- Open this file in a browser and click each button to download the PNG icons -->
<html><body style="font-family:sans-serif;padding:20px;background:#0f1117;color:#e8eaf6">
<h2>TermsLens Icon Generator</h2>
<p>Click each button to download the icon at the required size.</p>
<div id="previews"></div>
<script>
const sizes = [16, 48, 128];

function drawIcon(size) {
  const canvas = document.createElement('canvas');
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');

  // Background circle
  const cx = size / 2, cy = size / 2, r = size / 2 - 1;
  const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
  grad.addColorStop(0, '#2a3a6e');
  grad.addColorStop(1, '#1a2455');
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fillStyle = grad;
  ctx.fill();

  // Lens circle
  const lensR = size * 0.28;
  const lensX = size * 0.38, lensY = size * 0.38;
  ctx.beginPath();
  ctx.arc(lensX, lensY, lensR, 0, Math.PI * 2);
  ctx.strokeStyle = '#4f8ef7';
  ctx.lineWidth = Math.max(1.5, size / 16);
  ctx.stroke();

  // Lens handle
  const angle = Math.PI * 0.75;
  const hx1 = lensX + Math.cos(angle) * lensR;
  const hy1 = lensY + Math.sin(angle) * lensR;
  const hx2 = lensX + Math.cos(angle) * (lensR + size * 0.22);
  const hy2 = lensY + Math.sin(angle) * (lensR + size * 0.22);
  ctx.beginPath();
  ctx.moveTo(hx1, hy1);
  ctx.lineTo(hx2, hy2);
  ctx.strokeStyle = '#4f8ef7';
  ctx.lineWidth = Math.max(2, size / 12);
  ctx.lineCap = 'round';
  ctx.stroke();

  return canvas;
}

const previews = document.getElementById('previews');
for (const size of sizes) {
  const canvas = drawIcon(size);
  canvas.style.margin = '8px';
  canvas.style.border = '1px solid #2a2d45';
  canvas.style.borderRadius = '4px';

  const btn = document.createElement('button');
  btn.textContent = `Download icon${size}.png`;
  btn.style.cssText = 'display:block;margin:8px 0;padding:8px 16px;background:#4f8ef7;color:white;border:none;border-radius:6px;cursor:pointer;font-size:13px';
  btn.onclick = () => {
    const link = document.createElement('a');
    link.download = `icon${size}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  };

  const div = document.createElement('div');
  div.style.display = 'inline-block';
  div.style.textAlign = 'center';
  div.style.marginRight = '24px';
  div.appendChild(canvas);
  div.appendChild(btn);
  previews.appendChild(div);
}
</script>
</body></html>
